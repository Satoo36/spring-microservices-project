server:
  port: 8082

spring:
  application:
    name: order-service   # must match the name used by other services' @FeignClient(name="order-service")

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true      # must be true — order-service needs to discover user-service + product-service
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ============================================================
# FEIGN CONFIGURATION
# ============================================================
spring.cloud.openfeign:
  # Enable Spring Cloud LoadBalancer integration (replaces Netflix Ribbon)
  # This is what makes lb://service-name work in Feign calls
  client:
    config:
      default:
        # Log level for Feign HTTP calls (NONE, BASIC, HEADERS, FULL)
        # FULL logs request + response headers and body — useful for debugging
        logger-level: BASIC

logging:
  level:
    com.microservices.order: DEBUG
    # Shows Feign request/response details at BASIC level
    com.microservices.order.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info
